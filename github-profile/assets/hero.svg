<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="304" viewBox="0 0 1120 304" role="img" aria-labelledby="t d">
<title id="t">Hessah AlMujally — AI Engineer</title><desc id="d">Animated retro-tech pixel banner in black, mint and ultraviolet.</desc>
<defs>
