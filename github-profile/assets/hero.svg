 <filter id="g"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
 .cursor{animation:blink 1.1s steps(1,end) infinite}.pixel{animation:glow 2.6s ease-in-out infinite alternate}.pixel2{animation:glow 3.1s ease-in-out 1.1s infinite alternate}.bar{animation:scan 6s linear infinite}.n{animation:float 3.8s ease-in-out infinite alternate}
 @keyframes blink{50%{opacity:0}}
 @keyframes glow{to{opacity:.25}}
 @keyframes scan{0%{transform:translateY(-240px);opacity:0}12%{opacity:.3}90%{opacity:.3}100%{transform:translateY(240px);opacity:0}}
 @keyframes float{to{transform:translateY(-8px)}}
</style>
