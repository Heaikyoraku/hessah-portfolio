<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title desc">
<title id="title">Hessah AlMujally</title>
<desc id="desc">Minimal black and violet typographic header with a small animated pixel accent.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090E"/><stop offset=".58" stop-color="#10101A"/><stop offset="1" stop-color="#151021"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#9470D9"/><stop offset="1" stop-color="#C7B1FC"/></linearGradient>
  <linearGradient id="track" x1="0" x2="1"><stop stop-color="#8662BA" stop-opacity="0"/><stop offset=".7" stop-color="#B59AEF"/><stop offset="1" stop-color="#8662BA" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .pixel{animation:shine 3.8s ease-in-out infinite alternate}
  .pixel:nth-child(2n){animation-delay:-1.1s}
  .pixel:nth-child(3n){animation-delay:-2.4s}
  .track{animation:move 8s ease-in-out infinite alternate;transform-origin:790px 235px}
  @keyframes shine{to{opacity:.23}}
  @keyframes move{to{transform:translateX(68px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
