<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 312" width="1120" height="312" role="img" aria-labelledby="title desc">
  <title id="title">Hessah AlMujally — AI Engineer</title>
  <desc id="desc">Dark indigo technical profile banner with a subtly animated data-to-model-to-service network and restrained pixel grid.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E21"/>
      <stop offset=".57" stop-color="#121631"/>
      <stop offset="1" stop-color="#1B1D40"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#719CFF"/><stop offset="1" stop-color="#B18CF6"/></linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#A5A9EC" stroke-width=".7" opacity=".10"/></pattern>
    <radialGradient id="glow"><stop stop-color="#5D49BD" stop-opacity=".28"/><stop offset="1" stop-color="#5D49BD" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .wire{stroke-dasharray:4 9;animation:flow 10s linear infinite;}
    .beacon{animation:pulse 3.3s ease-in-out infinite alternate;}
    .beacon2{animation:pulse 4.4s ease-in-out 1s infinite alternate;}
    .cursor{animation:blink 1.25s steps(1,end) infinite;}
    .scan{animation:sweep 9s ease-in-out infinite alternate;}
    .pixel{animation:pulse 3s ease-in-out infinite alternate;}
    @keyframes flow{to{stroke-dashoffset:-156}}
    @keyframes pulse{to{opacity:.35}}
    @keyframes blink{50%{opacity:0}}
    @keyframes sweep{to{transform:translateY(225px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1120" height="312" rx="16" fill="url(#bg)"/>
  <rect width="1120" height="312" rx="16" fill="url(#grid)"/>
  <ellipse cx="885" cy="139" rx="315" ry="233" fill="url(#glow)"/>
  <path d="M24 24H1096V288H24Z" fill="none" stroke="#8587C6" stroke-width="1" opacity=".35"/>
  <path d="M24 55H1096" stroke="#8587C6" opacity=".22"/>
  <path d="M56 39h19m10 0h19" stroke="#A48EEA" stroke-width="3"/>
  <rect x="117" y="34" width="7" height="7" fill="#6CA1EB"/>
  <text x="136" y="43" font-family="monospace" font-size="12" letter-spacing="1.8" fill="#9DAAD0">HEAIKYORAKU / PROFILE</text>
  <text x="55" y="113" font-family="monospace" font-size="15" fill="#89A9FB" letter-spacing="2.2">&gt; identity<tspan class="cursor">_</tspan></text>
  <g font-family="monospace" font-weight="700" letter-spacing="-2">
    <text x="52" y="178" font-size="62" fill="#F1F0FF">HESSAH</text>
    <text x="52" y="240" font-size="62" fill="#BAA8FF">ALMUJALLY</text>
  </g>
  <text x="56" y="272" font-family="monospace" font-size="15" letter-spacing="1.5" fill="#B6BADA">AI ENGINEER  /  RIYADH, SA</text>
  <path d="M627 77V273" stroke="#7788C0" opacity=".26"/>
  <g font-family="monospace">
    <text x="671" y="85" font-size="12" letter-spacing="2" fill="#8D9ED4">SYSTEM OVERVIEW</text>
    <text x="990" y="85" font-size="11" letter-spacing="1" fill="#9381CF">[ ONLINE ]</text>
    <path d="M671 98H1064" stroke="#737FAC" opacity=".27"/>
    <rect x="683" y="122" width="160" height="42" rx="3" fill="#171D3A" stroke="#738DDD" stroke-opacity=".78"/>
    <rect x="892" y="122" width="160" height="42" rx="3" fill="#171D3A" stroke="#AB91EF" stroke-opacity=".78"/>
    <rect x="683" y="211" width="160" height="42" rx="3" fill="#171D3A" stroke="#AB91EF" stroke-opacity=".78"/>
    <rect x="892" y="211" width="160" height="42" rx="3" fill="#171D3A" stroke="#738DDD" stroke-opacity=".78"/>
    <text x="715" y="148" fill="#DCE3FF" font-size="16">01 / DATA</text>
    <text x="922" y="148" fill="#E9DEFF" font-size="16">02 / MODEL</text>
    <text x="715" y="237" fill="#E9DEFF" font-size="16">04 / SYSTEM</text>
    <text x="922" y="237" fill="#DCE3FF" font-size="16">03 / API</text>
    <path class="wire" d="M843 143H892M973 164V211M892 232H843" fill="none" stroke="url(#line)" stroke-width="2.5"/>
    <circle class="beacon" cx="843" cy="143" r="4.5" fill="#90BAFF"/>
    <circle class="beacon2" cx="973" cy="211" r="4.5" fill="#B69EF6"/>
    <circle class="beacon" cx="843" cy="232" r="4.5" fill="#B69EF6"/>
    <path d="M671 275H1064" stroke="#737FAC" opacity=".35"/>
    <text x="674" y="291" fill="#7784AC" font-size="10" letter-spacing="2">ML   /   GENAI   /   DATA SYSTEMS</text>
  </g>
  <g fill="#A6B4F0" opacity=".55">
    <rect class="pixel" x="1072" y="109" width="6" height="6"/>
    <rect x="657" y="182" width="6" height="6"/>
    <rect class="pixel" x="1083" y="196" width="4" height="4"/>
  </g>
</svg>